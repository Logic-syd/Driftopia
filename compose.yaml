services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: driftopia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-driftopia_dev}
      POSTGRES_DB: driftopia
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftopia"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  redis-data:
