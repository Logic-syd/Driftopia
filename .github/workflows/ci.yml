name: Quality and game flow
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: driftopia
          POSTGRES_PASSWORD: driftopia_dev
          POSTGRES_DB: driftopia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U driftopia"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://driftopia:driftopia_dev@localhost:5432/driftopia
      REDIS_URL: redis://localhost:6379
      WEB_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://localhost:5174
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate && pnpm db:migrate && pnpm db:seed
      - run: pnpm lint && pnpm test && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: |
          pnpm dev > /tmp/driftopia-dev.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3001/api/health && curl -fsS -o /dev/null http://127.0.0.1:5173; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/api/health
      - run: pnpm test:integration
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
            docs/screenshots/
            /tmp/driftopia-dev.log
