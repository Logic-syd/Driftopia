# Legacy example only. compose.production.yaml uses Caddyfile with automatic HTTPS.
# Place behind a TLS terminator, or add ssl_certificate/listen 443 here.
server {
    listen 80;
    server_name _;
    root /srv/driftopia/web;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /socket.io/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
